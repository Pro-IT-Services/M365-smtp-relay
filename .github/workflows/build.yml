name: Build and release

# Every push to main is tested and built. Pushing a version tag (v1.2.3) additionally publishes a
# GitHub release with the archives and their checksums.
#
# Everything runs inside a throwaway Debian container on a self-hosted runner. The runner only
# needs Docker: the container installs the newest stable Go itself, and each job removes its
# container, the image (if the job pulled it) and its workspace when it ends.
#
# Pull requests are deliberately not built: a self-hosted runner must not run code from forks.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: debian:stable-slim

jobs:
  build:
    name: Test and build
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Note whether the image is already on the runner
        id: image
        run: |
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build in a container
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --pull always \
            --name "graphrelay-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e VERSION -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE" bash .github/scripts/build.sh

      - name: Keep the archives
        uses: actions/upload-artifact@v4
        with:
          name: graphrelay-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Clean up
        if: always()
        run: |
          docker rm -f "graphrelay-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
          # Remove the image only if this job brought it onto the runner.
          if [ "${{ steps.image.outputs.present }}" = false ]; then
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          fi
          docker image prune -f >/dev/null 2>&1 || true
          # Empty the workspace, including hidden files.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the archives
        uses: actions/download-artifact@v4
        with:
          name: graphrelay-${{ needs.build.outputs.version }}
          path: dist/

      - name: Note whether the image is already on the runner
        id: image
        run: |
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          docker run --rm --pull always \
            --name "graphrelay-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e VERSION -e GITHUB_REPOSITORY -e GITHUB_TOKEN \
            "$IMAGE" bash .github/scripts/release.sh

      - name: Clean up
        if: always()
        run: |
          docker rm -f "graphrelay-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
          if [ "${{ steps.image.outputs.present }}" = false ]; then
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          fi
          docker image prune -f >/dev/null 2>&1 || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
