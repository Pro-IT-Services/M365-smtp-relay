name: Build and release

# Every push to main is tested and built. Pushing a version tag (v1.2.3) additionally publishes a
# GitHub release with the archives and their checksums.
#
# Everything runs inside throwaway Debian containers on a self-hosted runner. The runner only needs
# Docker: the containers fetch the source and install the newest stable Go themselves, and the job
# removes its containers, the image (if the job pulled it) and its files when it ends.
#
# No external actions are used (not even actions/checkout), so the workflow also runs where the
# Actions policy only allows actions from the repository itself.
#
# The build container runs the tests and third-party dependency code, so it is kept away from the
# write token: it gets no token, sees the source read-only and can only write the archives. The
# release script is set aside before the build and runs without access to the workspace.
#
# Pull requests are deliberately not built: a self-hosted runner must not run code from forks.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # read the source; on tags, create the release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: debian:stable-slim
  CONTAINER: graphrelay-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Test, build and release
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Prepare
        id: prep
        run: |
          # Start from an empty workspace, whatever an earlier job left behind.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
          # A private area outside the workspace for the archives and the release script.
          work="$RUNNER_TEMP/$CONTAINER"
          rm -rf "$work"
          mkdir -p "$work/dist" "$work/scripts"
          echo "WORK=$work" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # Remember whether the image was already on the runner, so cleanup only removes what we brought.
          if docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "image_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the source (in a container)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --pull always --name "$CONTAINER-fetch" \
            -v "$GITHUB_WORKSPACE:/src" -w /src \
            -e GITHUB_TOKEN -e GITHUB_SERVER_URL -e GITHUB_REPOSITORY -e GITHUB_SHA \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE" bash -euo pipefail -c '
              trap "chown -R \"$HOST_UID:$HOST_GID\" /src" EXIT
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -q
              apt-get install -y -q --no-install-recommends ca-certificates git
              git config --global --add safe.directory /src
              git init -q .
              git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
              auth=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 -w0)
              git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$GITHUB_SHA"
              git checkout -q FETCH_HEAD
              git log -1 --format="checked out %h %s"
            '
          # Set the release script aside now, before any build code runs.
          cp "$GITHUB_WORKSPACE/.github/scripts/release.sh" "$WORK/scripts/release.sh"

      - name: Test and build (in a container)
        env:
          VERSION: ${{ steps.prep.outputs.version }}
        run: |
          # No token, source read-only, archives written to a separate directory.
          docker run --rm --name "$CONTAINER-build" \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$WORK/dist:/out" -w /src \
            -e VERSION -e DIST=/out -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            "$IMAGE" bash .github/scripts/build.sh

      - name: Publish the release (in a container)
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.prep.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the script set aside earlier and the archives are mounted, both read-only.
          docker run --rm --name "$CONTAINER-release" \
            -v "$WORK/scripts:/scripts:ro" -v "$WORK/dist:/dist:ro" \
            -e VERSION -e GITHUB_REPOSITORY -e GITHUB_TOKEN -e DIST=/dist \
            "$IMAGE" bash /scripts/release.sh

      - name: Clean up
        if: always()
        run: |
          for c in fetch build release; do
            docker rm -f "$CONTAINER-$c" >/dev/null 2>&1 || true
          done
          # Remove the image only if this job brought it onto the runner.
          if [ "${{ steps.prep.outputs.image_present }}" = false ]; then
            docker image rm "$IMAGE" >/dev/null 2>&1 || true
          fi
          docker image prune -f >/dev/null 2>&1 || true
          # Remove the archives, the script copy and everything in the workspace, hidden files included.
          rm -rf "$RUNNER_TEMP/$CONTAINER" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
